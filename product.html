<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" href="/">ShopEase<span>.</span></a><nav><a href="/">Shop</a><a href="/signup">Sign up</a><a href="/cart">Cart</a></nav></header><main class="detail-wrap"><a class="back" href="/">← Back to shop</a><div class="detail"><img class="detail-image" th:src="${product.imageUrl}" th:alt="${product.name}"><div class="detail-info"><p class="eyebrow" th:text="${product.category}">Category</p><h1 th:text="${product.name}">Product</h1><p class="detail-price" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,2)}">₹0</p><p th:text="${product.description}">Description</p><p class="stock" th:text="${product.stock > 0 ? 'In stock · ' + product.stock + ' available' : 'Out of stock'}">In stock</p><form method="post" action="/cart" class="detail-form"><input type="hidden" name="productId" th:value="${product.id}"><label>Quantity <input name="quantity" type="number" value="1" min="1" max="99" required></label><button class="button dark" type="submit" th:disabled="${product.stock < 1}">Add to cart</button></form><p class="muted small">Demo store only. No payment is taken.</p></div></div></main><footer><a class="brand" href="/">ShopEase<span>.</span></a><p>Simple finds for everyday living.</p></footer></body></html>
