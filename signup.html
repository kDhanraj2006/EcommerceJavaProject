<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" href="/">ShopEase<span>.</span></a><nav><a href="/">Shop</a><a href="/cart">Cart</a></nav></header><main class="signup-wrap"><section class="checkout-card"><p class="eyebrow">JOIN SHOP EASE</p><h1>Create account</h1><p class="muted">Create a demo customer account.</p><div class="notice" th:if="${message}" th:text="${message}"></div><div class="notice error" th:if="${error}" th:text="${error}"></div><form action="/signup" method="post" class="checkout-form"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email address<input name="email" type="email" required maxlength="180" autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="button dark full" type="submit">Create account</button></form><p class="small muted">This starter stores a BCrypt password hash. Login/session authentication is not included yet.</p></section></main><footer><a class="brand" href="/">ShopEase<span>.</span></a></footer></body></html>
