<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" href="/">ShopEase<span>.</span></a><nav><a href="/">Shop</a><a href="/cart">Cart</a></nav></header><main class="checkout-wrap"><a class="back" href="/cart">← Back to cart</a><div class="checkout-grid"><section class="checkout-card"><p class="eyebrow">ALMOST YOURS</p><h1>Checkout</h1><p class="muted">Enter your delivery details to place a demo order.</p><form action="/checkout" method="post" class="checkout-form"><label>Full name<input name="name" required maxlength="120" autocomplete="name" placeholder="Your full name"></label><label>Email address<input name="email" type="email" required maxlength="180" autocomplete="email" placeholder="you@example.com"></label><label>Delivery address<textarea name="address" required maxlength="500" rows="4" autocomplete="street-address" placeholder="Street, city, state, PIN code"></textarea></label><button class="button dark full" type="submit">Place demo order</button></form><p class="small muted">This student project does not collect card details or process payments.</p></section><aside class="summary"><h2>Order total</h2><div class="summary-row total"><span>Total</span><strong th:text="'₹' + ${#numbers.formatDecimal(total,1,2)}">₹0</strong></div><p class="muted small">Shipping is free for this demo.</p></aside></div></main><footer><a class="brand" href="/">ShopEase<span>.</span></a><p>Simple finds for everyday living.</p></footer></body></html>
